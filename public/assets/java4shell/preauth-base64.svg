<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="1000" height="470" rx="14" fill="#0f172a"/>
<text x="40" y="46" fill="#e2e8f0" font-size="22" font-weight="700">Base64 your server decodes before it knows who you are</text>
<text x="40" y="72" fill="#94a3b8" font-size="14">Every highlighted value goes through a Base64 decoder before authentication completes</text>
<rect x="40" y="94" width="920" height="336" rx="10" fill="#1e293b" stroke="#334155"/>
<text x="64" y="132" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">POST /sso/login HTTP/1.1</text>
<text x="64" y="166" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">Host: sso.example.com</text>
<text x="64" y="200" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">Authorization: Basic </text>
<rect x="238.4" y="183" width="172.0" height="24" rx="4" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8"/>
<text x="240.4" y="200" fill="#e2e8f0" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">YWxpY2U6aHVudGVyMg==</text>
<text x="64" y="234" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">Cookie: session=</text>
<rect x="196.4" y="217" width="390.40000000000003" height="24" rx="4" fill="#c084fc" fill-opacity="0.22" stroke="#c084fc"/>
<text x="198.4" y="234" fill="#e2e8f0" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhbGljZSJ9.c2ln</text>
<text x="584.8000000000001" y="234" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">; csrf=</text>
<rect x="641.6" y="217" width="71.2" height="24" rx="4" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24"/>
<text x="643.6" y="234" fill="#e2e8f0" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">dDBrM24=</text>
<text x="64" y="268" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">Content-Type: application/x-www-form-urlencoded</text>
<text x="64" y="302" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve"></text>
<text x="64" y="302" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">SAMLResponse=</text>
<rect x="171.2" y="285" width="407.20000000000005" height="24" rx="4" fill="#4ade80" fill-opacity="0.22" stroke="#4ade80"/>
<text x="173.2" y="302" fill="#e2e8f0" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" xml:space="preserve">PHNhbWxwOlJlc3BvbnNlIElEPSJfYWJjMTIzIi4uLg%3D%3D</text>
<rect x="64" y="360" width="16" height="16" rx="3" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8"/>
<text x="90" y="373" fill="#e2e8f0" font-size="14" font-weight="600">Basic auth</text>
<text x="240" y="373" fill="#94a3b8" font-size="13">user:password, decoded to check it</text>
<rect x="514" y="360" width="16" height="16" rx="3" fill="#c084fc" fill-opacity="0.35" stroke="#c084fc"/>
<text x="540" y="373" fill="#e2e8f0" font-size="14" font-weight="600">JWT</text>
<text x="690" y="373" fill="#94a3b8" font-size="13">three Base64URL segments</text>
<rect x="64" y="400" width="16" height="16" rx="3" fill="#fbbf24" fill-opacity="0.35" stroke="#fbbf24"/>
<text x="90" y="413" fill="#e2e8f0" font-size="14" font-weight="600">CSRF token</text>
<text x="240" y="413" fill="#94a3b8" font-size="13">often a Base64 random blob</text>
<rect x="514" y="400" width="16" height="16" rx="3" fill="#4ade80" fill-opacity="0.35" stroke="#4ade80"/>
<text x="540" y="413" fill="#e2e8f0" font-size="14" font-weight="600">SAML response</text>
<text x="690" y="413" fill="#94a3b8" font-size="13">a Base64 XML document from the IdP</text>
</svg>